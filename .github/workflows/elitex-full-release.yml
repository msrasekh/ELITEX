name: ELITEX Full Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify RC18 overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-source
          if [ ! -f ci-source/ELITEX_OVERLAY_RC18_8.tar.xz ]; then
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.usercontent.google.com/download?id=1U-i_9wDxOj9wY-ZLOmz66Ff23l3fG3j9&export=download&confirm=t" -o ci-source/ELITEX_OVERLAY_RC18_8.tar.xz
          fi
          echo "52b120a01c2086e84b934ba8bb6afb692ab0568794b263f831d01da98a8a6907  ci-source/ELITEX_OVERLAY_RC18_8.tar.xz" | sha256sum -c -
      - name: Reconstruct complete ELITEX source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/jammy928/CoinExchange_CryptoExchange_Java.git prepared
          tar -xJf ci-source/ELITEX_OVERLAY_RC18_8.tar.xz -C prepared
          test -f prepared/00_framework/pom.xml
          test -f prepared/01_wallet_rpc/pom.xml
          test -f prepared/00_framework_modern/pom.xml
          test -f prepared/05_Web_Front/package.json
          test -f prepared/04_Web_Admin/package.json
          test -d prepared/02_App_Android_ELITEX
          test -d prepared/03_APP_IOS_ELITEX
          test -f prepared/ELITEX_OVERLAY_MANIFEST.json
          echo "ELITEX RC18 full-source baseline reconstructed"
          tar -cJf prepared-source.tar.xz prepared
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          if-no-files-found: error
          retention-days: 7
          path: prepared-source.tar.xz

  legacy-backend:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '8', cache: maven}
      - name: Compile legacy backend and wallet RPC
        run: |
          mvn -f prepared/00_framework/pom.xml -DskipTests=false clean verify
          mvn -f prepared/01_wallet_rpc/pom.xml -DskipTests=false clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-java-artifacts
          if-no-files-found: error
          path: |
            prepared/00_framework/**/target/*.jar
            prepared/01_wallet_rpc/**/target/*.jar

  modern-backend:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Compile modern backend
        run: mvn -f prepared/00_framework_modern/pom.xml -DskipTests=false clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: modern-java-artifacts
          if-no-files-found: error
          path: prepared/00_framework_modern/**/target/*.jar

  legacy-web:
    needs: source-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-node@v4
        with: {node-version: '10.24.1'}
      - name: Build legacy user/admin web
        run: |
          cd prepared/05_Web_Front && npm ci && npm run build
          cd ../04_Web_Admin && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-web-dist
          if-no-files-found: error
          path: |
            prepared/05_Web_Front/dist/**
            prepared/04_Web_Admin/dist/**

  modern-web:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Build modern user/admin web
        run: |
          cd prepared/ELITEX_MODERNIZATION/frontend/user && npm ci && npm run verify && npm run build
          cd ../admin && npm ci && npm run verify && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: modern-web-dist
          if-no-files-found: error
          path: |
            prepared/05_Web_Front/dist-modern/**
            prepared/04_Web_Admin/dist-modern/**

  android:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build Android APK/AAB
        run: cd prepared/02_App_Android_ELITEX && gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: prepared/02_App_Android_ELITEX/app/build/outputs/**

  ios:
    needs: source-gate
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - name: Build unsigned iOS archive
        run: xcodebuild -project prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj -scheme ELITEX -configuration Release -archivePath "$RUNNER_TEMP/ELITEX.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-xcarchive
          if-no-files-found: error
          path: ${{ runner.temp }}/ELITEX.xcarchive

  windows-desktop:
    needs: source-gate
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - shell: pwsh
        run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --name ELITEX prepared/07_Desktop_ELITEX/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          if-no-files-found: error
          path: dist/ELITEX.exe

  artifact-inventory:
    if: always()
    needs: [source-gate, legacy-backend, modern-backend, legacy-web, modern-web, android, ios, windows-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Record gate status
        shell: bash
        env:
          SOURCE: ${{ needs.source-gate.result }}
          LEGACY_BACKEND: ${{ needs.legacy-backend.result }}
          MODERN_BACKEND: ${{ needs.modern-backend.result }}
          LEGACY_WEB: ${{ needs.legacy-web.result }}
          MODERN_WEB: ${{ needs.modern-web.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          WINDOWS: ${{ needs.windows-desktop.result }}
        run: |
          python3 - <<'PY'
          import json, os
          keys=['SOURCE','LEGACY_BACKEND','MODERN_BACKEND','LEGACY_WEB','MODERN_WEB','ANDROID','IOS','WINDOWS']
          d={k:os.environ[k] for k in keys}
          d['final_build_gate']='PASS' if all(v=='success' for v in d.values()) else 'FAIL'
          open('ELITEX_BUILD_GATE.json','w').write(json.dumps(d,indent=2))
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elitex-build-gate
          path: ELITEX_BUILD_GATE.json
      - name: Enforce final build gate
        shell: bash
        run: python3 -c "import json; assert json.load(open('ELITEX_BUILD_GATE.json'))['final_build_gate']=='PASS'"
