name: ELITEX Full Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover canonical verified RC18 prepared source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o prepared-artifact.zip
          unzip -q prepared-artifact.zip
          test -f prepared-source.tar.xz
          tar -xJf prepared-source.tar.xz
          test -f prepared/ELITEX_OVERLAY_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with: {name: prepared-source, path: prepared-source.tar.xz, retention-days: 14}
  modern-backend:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - name: Java 21 compatibility migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          root=Path('prepared/00_framework_modern'); ns='http://maven.apache.org/POM/4.0.0'; N={'m':ns}; ET.register_namespace('',ns)
          versions={('org.elasticsearch','elasticsearch'):'6.2.4',('org.springframework.session','spring-session'):'1.3.5.RELEASE',('mysql','mysql-connector-java'):'8.0.11',('ch.qos.logback','logback-core'):'1.2.13',('ch.qos.logback','logback-classic'):'1.2.13',('org.slf4j','slf4j-api'):'1.7.36',('io.reactivex','rxjava'):'1.3.8'}
          for p in root.rglob('pom.xml'):
            tree=ET.parse(p); r=tree.getroot(); changed=False
            for d in r.findall('.//m:dependencies/m:dependency',N):
              g=d.find('m:groupId',N); a=d.find('m:artifactId',N); v=d.find('m:version',N); key=((g.text or '').strip() if g is not None else '',(a.text or '').strip() if a is not None else '')
              if key in versions and v is None: ET.SubElement(d,f'{{{ns}}}version').text=versions[key]; changed=True
            if changed: tree.write(p,encoding='utf-8',xml_declaration=True)
          for p in root.rglob('*.java'):
            s=p.read_text(encoding='utf-8',errors='ignore'); n=s.replace('org.hibernate.validator.constraints.NotBlank','javax.validation.constraints.NotBlank').replace('org.hibernate.validator.constraints.NotEmpty','javax.validation.constraints.NotEmpty').replace('import sun.misc.BASE64Encoder;','import java.util.Base64;').replace('import com.mongodb.Mongo;\n',''); n=re.sub(r'new BASE64Encoder\(\)\.encode\(([^;]+)\)',r'Base64.getEncoder().encodeToString(\1)',n)
            if n!=s:p.write_text(n,encoding='utf-8')
          cp=root/'core/pom.xml'; tree=ET.parse(cp); r=tree.getroot(); deps=r.find('m:dependencies',N); existing={(d.find('m:groupId',N).text,d.find('m:artifactId',N).text) for d in deps.findall('m:dependency',N) if d.find('m:groupId',N) is not None and d.find('m:artifactId',N) is not None}
          for g,a,v in [('org.dom4j','dom4j','2.1.4'),('org.apache.httpcomponents','httpcore','4.4.16')]:
            if (g,a) not in existing:
              d=ET.SubElement(deps,f'{{{ns}}}dependency'); ET.SubElement(d,f'{{{ns}}}groupId').text=g; ET.SubElement(d,f'{{{ns}}}artifactId').text=a; ET.SubElement(d,f'{{{ns}}}version').text=v
          tree.write(cp,encoding='utf-8',xml_declaration=True)
          ap=root/'core/src/main/java/com/bizzan/bitrade/constant/AdminModule.java'
          if ap.exists():
            s=ap.read_text(encoding='utf-8').replace('@AllArgsConstructor','').replace('@Getter','')
            # Remove any previously misplaced generated members before imports/type declaration.
            s=re.sub(r'\n\s*private final String cnName;\s*\n\s*AdminModule\(String cnName\) \{ this\.cnName = cnName; \}\s*\n\s*public String getCnName\(\) \{ return cnName; \}\s*\n','\n',s)
            m=re.search(r'enum\s+AdminModule[^\{]*\{',s)
            if not m: raise SystemExit('AdminModule enum declaration missing')
            semi=s.find(';',m.end())
            if semi<0: raise SystemExit('AdminModule constants terminator missing')
            members='\n    private final String cnName;\n    AdminModule(String cnName) { this.cnName = cnName; }\n    public String getCnName() { return cnName; }\n'
            s=s[:semi+1]+members+s[semi+1:]
            ap.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -f prepared/00_framework_modern/pom.xml -DskipTests=false clean verify
      - uses: actions/upload-artifact@v4
        with: {name: modern-java-artifacts, if-no-files-found: error, path: 'prepared/00_framework_modern/**/target/*.jar'}
  modern-web:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          set -e
          for d in prepared/ELITEX_MODERNIZATION/frontend/user prepared/ELITEX_MODERNIZATION/frontend/admin; do cd "$GITHUB_WORKSPACE/$d"; npm install --legacy-peer-deps --package-lock=false; npm run verify; npm run build; done
      - uses: actions/upload-artifact@v4
        with: {name: modern-web-dist, if-no-files-found: error, path: 'prepared/{05_Web_Front,04_Web_Admin}/dist-modern/**'}
  android:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          cd prepared/02_App_Android_ELITEX
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with: {name: android-release, if-no-files-found: error, path: 'prepared/02_App_Android_ELITEX/app/build/outputs/**'}
  ios:
    needs: source-gate
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - run: tar -xJf prepared-source.tar.xz
      - name: Build real iOS device archive
        run: xcodebuild -project prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj -scheme ELITEX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ELITEX.xcarchive" archive CODE_SIGNING_ALLOWED=NO SDKROOT=iphoneos SUPPORTED_PLATFORMS=iphoneos TARGETED_DEVICE_FAMILY='1,2'
      - uses: actions/upload-artifact@v4
        with: {name: ios-unsigned-xcarchive, path: '${{ runner.temp }}/ELITEX.xcarchive', if-no-files-found: error}
  windows-desktop:
    needs: source-gate
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with: {name: prepared-source}
      - shell: pwsh
        run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller; pyinstaller --noconfirm --clean --onefile --name ELITEX prepared/07_Desktop_ELITEX/launcher.py
      - uses: actions/upload-artifact@v4
        with: {name: windows-desktop, path: dist/ELITEX.exe, if-no-files-found: error}
  final-gate:
    if: always()
    needs: [source-gate, modern-backend, modern-web, android, ios, windows-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce real final gate
        env: {SOURCE: '${{ needs.source-gate.result }}', BACKEND: '${{ needs.modern-backend.result }}', WEB: '${{ needs.modern-web.result }}', ANDROID: '${{ needs.android.result }}', IOS: '${{ needs.ios.result }}', WINDOWS: '${{ needs.windows-desktop.result }}'}
        run: |
          python3 - <<'PY'
          import os,json
          d={k:os.environ[k] for k in ['SOURCE','BACKEND','WEB','ANDROID','IOS','WINDOWS']}; d['final_build_gate']='PASS' if all(v=='success' for v in d.values()) else 'FAIL'; open('ELITEX_BUILD_GATE.json','w').write(json.dumps(d,indent=2)); assert d['final_build_gate']=='PASS'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: elitex-build-gate, path: ELITEX_BUILD_GATE.json, retention-days: 14}
  release-bundle:
    needs: [source-gate, modern-backend, modern-web, android, ios, windows-desktop, final-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('release'); rows=[]
          for p in sorted(root.rglob('*')):
            if p.is_file(): rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'ELITEX_RELEASE_MANIFEST.json').write_text(json.dumps(rows,indent=2))
          PY
          cd release && zip -r -9 ../ELITEX_FULL_RELEASE.zip . && cd ..
          sha256sum ELITEX_FULL_RELEASE.zip > ELITEX_FULL_RELEASE.zip.sha256
      - uses: actions/upload-artifact@v4
        with: {name: ELITEX_FULL_RELEASE, if-no-files-found: error, retention-days: 14, path: 'ELITEX_FULL_RELEASE.zip*'}
