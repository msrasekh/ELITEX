name: ELITEX Full Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover canonical verified RC18 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o src.zip
          unzip -q src.zip
          test -f prepared-source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: prepared-source.tar.xz
  modern-backend:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - run: tar -xJf prepared-source.tar.xz
      - run: |
          python3 .github/scripts/normalize_final.py
          python3 .github/scripts/fix_mongo_legacy.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Delombok retained legacy sources
        run: |
          mvn -q dependency:get -Dartifact=org.projectlombok:lombok:1.18.40
          java -jar "$HOME/.m2/repository/org/projectlombok/lombok/1.18.40/lombok-1.18.40.jar" delombok prepared/00_framework_modern/core/src/main/java -d /tmp/core-delombok
          rm -rf prepared/00_framework_modern/core/src/main/java
          mkdir -p prepared/00_framework_modern/core/src/main
          mv /tmp/core-delombok prepared/00_framework_modern/core/src/main/java
      - run: mvn -f prepared/00_framework_modern/pom.xml -DskipTests=false clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: modern-java-artifacts
          path: prepared/00_framework_modern/**/target/*.jar
          if-no-files-found: error
  modern-web:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build user web
        run: |
          cd prepared/ELITEX_MODERNIZATION/frontend/user
          npm install --legacy-peer-deps --package-lock=false
          npm install --no-save --legacy-peer-deps postcss autoprefixer
          rm -rf ../../../05_Web_Front/node_modules
          ln -s "$PWD/node_modules" ../../../05_Web_Front/node_modules
          sed -i 's#href="/" rel="canonical"#href="https://elitex.local/" rel="canonical"#g' ../../../05_Web_Front/index.html
          npm run verify
          npm run build
      - name: Build admin web
        run: |
          cd prepared/ELITEX_MODERNIZATION/frontend/admin
          npm install --legacy-peer-deps --package-lock=false
          npm install --no-save --legacy-peer-deps postcss autoprefixer
          rm -rf ../../../04_Web_Admin/node_modules
          ln -s "$PWD/node_modules" ../../../04_Web_Admin/node_modules
          sed -i 's#href="/" rel="canonical"#href="https://elitex.local/" rel="canonical"#g' ../../../04_Web_Admin/index.html
          npm run verify
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: modern-web-dist
          path: |
            prepared/05_Web_Front/dist-modern/**
            prepared/04_Web_Admin/dist-modern/**
          if-no-files-found: error
  android:
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          cd prepared/02_App_Android_ELITEX
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: prepared/02_App_Android_ELITEX/app/build/outputs/**
          if-no-files-found: error
  ios:
    needs: source-gate
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - run: tar -xJf prepared-source.tar.xz
      - name: Normalize iOS project
        run: sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/SDKROOT = iphoneos; SUPPORTED_PLATFORMS = iphoneos; IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj/project.pbxproj
      - name: Archive iOS
        run: xcodebuild -project prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj -scheme ELITEX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ELITEX.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-xcarchive
          path: ${{ runner.temp }}/ELITEX.xcarchive
          if-no-files-found: error
  windows-desktop:
    needs: source-gate
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - shell: pwsh
        run: tar -xJf prepared-source.tar.xz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --name ELITEX prepared/07_Desktop_ELITEX/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/ELITEX.exe
          if-no-files-found: error
  final-gate:
    if: always()
    needs: [source-gate, modern-backend, modern-web, android, ios, windows-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          SOURCE: ${{ needs.source-gate.result }}
          BACKEND: ${{ needs.modern-backend.result }}
          WEB: ${{ needs.modern-web.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          WINDOWS: ${{ needs.windows-desktop.result }}
        run: |
          test "$SOURCE" = success
          test "$BACKEND" = success
          test "$WEB" = success
          test "$ANDROID" = success
          test "$IOS" = success
          test "$WINDOWS" = success
          printf '{"final_build_gate":"PASS"}\n' > ELITEX_BUILD_GATE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elitex-build-gate
          path: ELITEX_BUILD_GATE.json
  release-bundle:
    needs: [source-gate, modern-backend, modern-web, android, ios, windows-desktop, final-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Bundle
        run: |
          cd release
          zip -r -9 ../ELITEX_FULL_RELEASE.zip .
          cd ..
          sha256sum ELITEX_FULL_RELEASE.zip > ELITEX_FULL_RELEASE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ELITEX_FULL_RELEASE
          path: ELITEX_FULL_RELEASE.zip*
          if-no-files-found: error
          retention-days: 14
