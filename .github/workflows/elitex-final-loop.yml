name: ELITEX Deterministic Final Loop
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o src.zip
          unzip -q src.zip
          tar -xJf prepared-source.tar.xz
      - name: Normalize backend
        run: python3 .github/scripts/normalize_final.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend verify
        run: mvn -f prepared/00_framework_modern/pom.xml -DskipTests=false clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Web build
        run: |
          set -e
          for pair in user:05_Web_Front admin:04_Web_Admin; do
            d=${pair%%:*}
            legacy=${pair##*:}
            mod="$GITHUB_WORKSPACE/prepared/ELITEX_MODERNIZATION/frontend/$d"
            root="$GITHUB_WORKSPACE/prepared/$legacy"
            cd "$mod"
            npm install --legacy-peer-deps --package-lock=false
            npm install --no-save --legacy-peer-deps postcss autoprefixer
            rm -rf "$root/node_modules"
            ln -s "$mod/node_modules" "$root/node_modules"
            sed -i 's#href="/" rel="canonical"#href="https://elitex.local/" rel="canonical"#g' "$root/index.html"
            npm run verify
            npm run build
          done
      - name: Collect Linux artifacts
        run: |
          mkdir -p release/backend release/web
          find prepared/00_framework_modern -path '*/target/*.jar' -type f -exec cp {} release/backend/ \;
          cp -R prepared/05_Web_Front/dist-modern release/web/user
          cp -R prepared/04_Web_Admin/dist-modern release/web/admin
      - uses: actions/upload-artifact@v4
        with:
          name: elitex-linux-release
          path: release/**
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o src.zip && unzip -q src.zip && tar -xJf prepared-source.tar.xz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: |
          cd prepared/02_App_Android_ELITEX
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: prepared/02_App_Android_ELITEX/app/build/outputs/**
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o src.zip && unzip -q src.zip && tar -xJf prepared-source.tar.xz
      - name: Normalize project
        run: sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/SDKROOT = iphoneos; SUPPORTED_PLATFORMS = iphoneos; IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj/project.pbxproj
      - name: Archive iOS
        run: xcodebuild -project prepared/03_APP_IOS_ELITEX/ELITEX.xcodeproj -scheme ELITEX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ELITEX.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-xcarchive
          path: ${{ runner.temp }}/ELITEX.xcarchive
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Recover source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json"} -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10362279302/zip" -OutFile src.zip
          Expand-Archive src.zip . -Force
          tar -xJf prepared-source.tar.xz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller; pyinstaller --noconfirm --clean --onefile --name ELITEX prepared/07_Desktop_ELITEX/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/ELITEX.exe
          if-no-files-found: error
  bundle:
    needs: [linux, android, ios, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Create final bundle
        run: |
          echo '{"final_build_gate":"PASS","commit":"${{ github.sha }}"}' > release/ELITEX_BUILD_GATE.json
          cd release
          zip -r -9 ../ELITEX_FULL_RELEASE.zip .
          cd ..
          sha256sum ELITEX_FULL_RELEASE.zip > ELITEX_FULL_RELEASE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ELITEX_FULL_RELEASE
          path: ELITEX_FULL_RELEASE.zip*
          if-no-files-found: error
          retention-days: 14
