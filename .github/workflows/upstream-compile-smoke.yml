name: ELITEX Upstream Compile Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone pinned upstream
        run: |
          git clone https://github.com/jammy928/CoinExchange_CryptoExchange_Java.git src
          git -C src checkout 8adf508b996020d3efbeeb2473d7235bd01436fa

      - name: Apply confirmed cross-platform Maven fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/00_framework/exchange-api/pom.xml')
          s=p.read_text()
          s=s.replace('E:/10_Exchange/src/BizzanExchange_framework/jar/spark-core-2.6.0.jar','${project.basedir}/../jar/spark-core-2.6.0.jar')
          p.write_text(s)
          PY
          test -f src/00_framework/jar/spark-core-2.6.0.jar

      - name: Normalize upstream wallet Maven modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          pom = Path('src/01_wallet_rpc/pom.xml')
          ns_uri = 'http://maven.apache.org/POM/4.0.0'
          ns = {'m': ns_uri}
          ET.register_namespace('', ns_uri)

          tree = ET.parse(pom)
          root = tree.getroot()
          removed = []

          for modules in root.findall('.//m:modules', ns):
              seen = set()
              for module in list(modules):
                  name = (module.text or '').strip()
                  module_pom = pom.parent / name / 'pom.xml'
                  if not name or name in seen or not module_pom.is_file():
                      modules.remove(module)
                      removed.append(name or '<empty>')
                  else:
                      seen.add(name)

          tree.write(pom, encoding='utf-8', xml_declaration=True)
          print('Removed invalid/duplicate wallet modules:', removed)
          PY
          cat src/01_wallet_rpc/pom.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven framework verify
        run: mvn -f src/00_framework/pom.xml -DskipTests=false clean verify

      - name: Maven wallet RPC verify
        run: mvn -f src/01_wallet_rpc/pom.xml -DskipTests=false clean verify

  legacy-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone pinned upstream
        run: |
          git clone https://github.com/jammy928/CoinExchange_CryptoExchange_Java.git src
          git -C src checkout 8adf508b996020d3efbeeb2473d7235bd01436fa

      - name: Apply confirmed Linux case-sensitivity fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # User web: imports authored on case-insensitive filesystems.
          p=Path('src/05_Web_Front/src/config/routes.js')
          s=p.read_text()
          replacements={
            '../pages/index/index':'../pages/index/Index',
            '../pages/uc/login':'../pages/uc/Login',
            '../pages/uc/register':'../pages/uc/Register',
            '../pages/uc/findpwd':'../pages/uc/FindPwd',
            '../pages/exchange/exchange':'../pages/exchange/Exchange',
            '../pages/cms/help':'../pages/cms/Help',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          p.write_text(s)

          # Admin web: exact names verified from pinned upstream Git tree.
          for file in [
              'src/04_Web_Admin/src/views/activity/AddActivity.vue',
              'src/04_Web_Admin/src/views/content/AddHelpManage.vue',
              'src/04_Web_Admin/src/views/content/AddAnnouncement.vue',
              'src/04_Web_Admin/src/views/redenvelope/AddRedEnvelope.vue',
          ]:
              p=Path(file)
              s=p.read_text().replace('@/SMEditor/SMEditor.vue','@/smeditor/SMEditor.vue')
              p.write_text(s)

          p=Path('src/04_Web_Admin/src/router/router.js')
          s=p.read_text()
          admin_replacements={
              '@/views/content/helpManage.vue':'@/views/content/HelpManage.vue',
              '@/views/member/MemberManage.vue':'@/views/member/memberManage.vue',
              '@/views/otc/AdManage.vue':'@/views/otc/adManage.vue',
              '@/views/otc/CoinManage.vue':'@/views/otc/coinManage.vue',
              '@/views/otc/OrderManage.vue':'@/views/otc/orderManage.vue',
          }
          for a,b in admin_replacements.items():
              s=s.replace(a,b)
          p.write_text(s)
          PY

      - name: Setup Node 10 for legacy web builds
        uses: actions/setup-node@v4
        with:
          node-version: '10.24.1'

      - name: Build user web
        run: cd src/05_Web_Front && npm install && npm run build

      - name: Install admin dependencies
        working-directory: src/04_Web_Admin
        run: npm install

      - name: Build admin web with captured diagnostics
        working-directory: src/04_Web_Admin
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee admin-build.log

      - name: Upload admin build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-diagnostics
          path: src/04_Web_Admin/admin-build.log
          if-no-files-found: error
          retention-days: 3
