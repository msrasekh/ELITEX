name: ELITEX Final Closure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified prepared source from successful source gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10362279302/zip" -o prepared-artifact.zip
          unzip -q prepared-artifact.zip
          tar -xJf prepared-source.tar.xz
          test -f prepared/00_framework_modern/pom.xml
          test -f prepared/ELITEX_OVERLAY_MANIFEST.json
      - name: Normalize and migrate modern Maven source for Java 21
        run: python3 .github/scripts/normalize_final.py
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Delombok retained legacy sources
        run: |
          mvn -q dependency:get -Dartifact=org.projectlombok:lombok:1.18.40
          java -jar "$HOME/.m2/repository/org/projectlombok/lombok/1.18.40/lombok-1.18.40.jar" delombok prepared/00_framework_modern/core/src/main/java -d /tmp/core-delombok
          rm -rf prepared/00_framework_modern/core/src/main/java
          mkdir -p prepared/00_framework_modern/core/src/main
          mv /tmp/core-delombok prepared/00_framework_modern/core/src/main/java
      - name: Modern backend compile/test gate
        run: mvn -f prepared/00_framework_modern/pom.xml -DskipTests=false clean verify
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Modern web deterministic build gate
        run: |
          set -euo pipefail
          for d in prepared/ELITEX_MODERNIZATION/frontend/user prepared/ELITEX_MODERNIZATION/frontend/admin; do cd "$GITHUB_WORKSPACE/$d"; if [ -f package-lock.json ]; then npm ci; else npm install --package-lock=false; fi; npm run verify; npm run build; done
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: AndroidX release gate
        run: |
          cd prepared/02_App_Android_ELITEX
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          gradle assembleRelease bundleRelease
      - name: Produce closure evidence
        run: |
          mkdir -p closure
          cp prepared/ELITEX_OVERLAY_MANIFEST.json closure/
          find prepared/00_framework_modern -path '*/target/*.jar' -type f -exec cp {} closure/ \;
          find prepared/02_App_Android_ELITEX/app/build/outputs -type f -exec cp {} closure/ \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[]
          for p in sorted(Path('closure').glob('*')):
            if p.is_file(): rows.append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('closure/ELITEX_FINAL_CLOSURE_GATE.json').write_text(json.dumps({'gate':'PASS','artifacts':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: ELITEX_FINAL_CLOSURE, if-no-files-found: error, retention-days: 14, path: 'closure/**'}
